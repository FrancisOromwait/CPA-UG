<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPA Uganda</title>
  <link rel="preload" href="/fonts/google-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M8 21l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- LOGIN -->
<main id="login" class="login-wrap" hidden>
  <div class="login-card">
    <div class="brand-mark" id="loginMark"></div>
    <h1 id="loginTitle">CPA Uganda</h1>
    <p class="muted" id="loginSub">Sign in to continue.</p>
    <form id="loginForm" autocomplete="on">
      <!-- hidden unless there is a branch to choose (several branches, or the support login at #support) -->
      <label hidden>Sacco branch
        <select name="branch" id="loginBranch">
          <option value="">Loading branches…</option>
        </select>
      </label>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="error" role="alert" hidden></div>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>
</main>

<!-- APP -->
<div id="app" class="shell" hidden>
  <!-- phones only: a slim bar with the menu button and the logo; the menu slides in over the page -->
  <header class="mbar">
    <button type="button" class="mbar-btn" id="menuBtn" aria-controls="side" aria-expanded="false" aria-label="Open the menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 7h17M3.5 12h17M3.5 17h11"/></svg>
    </button>
    <span id="mbarMark"></span>
    <span id="mbarName">CPA Uganda</span>
    <button type="button" class="mbar-me" id="mbarMe" aria-label="Your account"><span id="mbarInitials" aria-hidden="true"></span></button>
  </header>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <aside class="side" id="side">
    <div class="side-brand">
      <span id="brandMark"></span>
      <span id="brandName">CPA Uganda</span>
      <button type="button" class="side-toggle" id="sideToggle" aria-pressed="false" aria-label="Fold the menu to icons" title="Fold the menu to icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2.75" y="3.75" width="18.5" height="16.5" rx="4.5"/><path d="M15 3.75v16.5"/></svg>
      </button>
      <button type="button" class="side-toggle side-close" id="sideClose" aria-label="Close the menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="me-menu" id="meMenu" role="menu">
        <button type="button" role="menuitem" id="chpw">Change password</button>
        <button type="button" role="menuitem" id="logout">Sign out</button>
      </div>
      <button type="button" class="me" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu">
        <span class="avatar" id="whoInitials" aria-hidden="true"></span>
        <span id="who"></span>
        <svg class="me-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </button>
    </div>
  </aside>
  <section class="main">
    <header class="top"><h2 id="title"></h2><span id="scope" class="pill"></span></header>
    <div id="view"></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
