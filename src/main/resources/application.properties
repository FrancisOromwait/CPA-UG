spring.application.name=cpa-uganda
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cpa_uganda?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# The name shown on the login page, the screens and the PDFs
sacco.app-name=CPA Uganda

# One branch only. The branch and its administrator are created on the first start.
# Leave a password empty to have one generated and written to the start-up window (the first start only).
sacco.single-branch.enabled=true
sacco.single-branch.code=CPA001
sacco.single-branch.name=CPA Uganda
sacco.single-branch.admin-username=${CPA_ADMIN_USER:admin}
sacco.single-branch.admin-password=${CPA_ADMIN_PASSWORD:}

# CPA's own chart of accounts (cpa-chart.txt) and the accounts the system posts to by code
sacco.accounts.chart-file=cpa-chart.txt
sacco.accounts.cash=3020
sacco.accounts.bank=3040
sacco.accounts.payroll=3040
sacco.accounts.mobile-money=3046
sacco.accounts.mobile-money-also=3044
sacco.accounts.mobile-money-parent=
sacco.accounts.mobile-money-from=3060
sacco.accounts.mobile-money-to=3099
sacco.accounts.loan-fee-income=1120
sacco.accounts.loan-process-fee-income=1110
sacco.accounts.loan-insurance=5130
sacco.accounts.legal-charges-income=1350
sacco.accounts.withdrawal-fee-income=1150
sacco.accounts.savings=5110
sacco.accounts.shares=4110
sacco.accounts.membership=1210
sacco.accounts.savings-interest-expense=2510
sacco.accounts.savings-interest-payable=5150
sacco.accounts.loans=3500
sacco.accounts.interest-receivable=3700
sacco.accounts.loan-interest-income=1130

# Loan interest by the days of the month, as the old system did it: a month's interest is the balance at its end x the yearly
# rate / 365 x the days of that month (a full month is charged in the first month, whatever day the loan is paid out).
sacco.loan-interest.daily=true
# the interest rate (% a year) a new loan starts with
sacco.loan-interest.default-rate=15

# What the loan form starts with (every one can be changed on the form): the application fee and legal charges are amounts, the
# process fee and insurance are a percentage of the loan. All four are taken out of what is paid out.
sacco.loan-fees.application=10000
sacco.loan-fees.process-percent=1
sacco.loan-fees.insurance-percent=0.6
sacco.loan-fees.legal-charges=0

# Interest on savings: a yearly rate worked out day by day on the savings balance, booked automatically after each month ends.
# It starts with this month (the old system's savings interest up to the month before came over with the member ledgers).
sacco.savings-interest.rate=8
sacco.savings-interest.day-basis=365
sacco.savings-interest.first-month=2026-10

# Loan interest is charged from this month on; earlier months came over from the old system with the member ledgers
sacco.interest.first-month=2026-10

# A support login for the person who looks after the system. It is not shown on the login page: open the address with #support.
sacco.bootstrap.manager.username=${MANAGER_USER:support}
sacco.bootstrap.manager.password=${MANAGER_PASSWORD:}
